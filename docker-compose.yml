services:
  backend:
    build: ./backend
    container_name: graphmind-backend
    ports:
      - "8000:8000"
    environment:
      FRONTEND_ORIGIN: http://localhost:3000
      DATABASE_PATH: /app/data/graphmind.db
      TREE_SITTER_CACHE_DIR: /app/data/parsers
    volumes:
      - graphmind-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    networks:
      - graphmind-network

  frontend:
    build: ./frontend
    container_name: graphmind-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      - backend
    networks:
      - graphmind-network

volumes:
  graphmind-data:

networks:
  graphmind-network:
    driver: bridge
