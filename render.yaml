services:
  - type: web
    name: graphmind-api
    runtime: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: graphmind-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/graphmind.db
      - key: TREE_SITTER_CACHE_DIR
        value: /tmp/tree-sitter
      - key: FRONTEND_ORIGIN
        value: "https://graph-mind-m5tfx1de9-juzt-none.vercel.app,*"
